<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | KKTC by Miracle</title>
  <meta name="description" content="A responsive gallery of Northern Cyprus imagery, with hover zoom effects and clean masonry-style spacing.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="site-shell">
    <header class="site-header" data-header>
      <a class="brand" href="index.html" aria-label="KKTC by Miracle home">
        <span class="brand-mark">K</span>
        <span class="brand-copy"><strong>KKTC by Miracle</strong><span>Northern Cyprus stories</span></span>
      </a>
      <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
      <nav class="nav" data-nav aria-label="Primary navigation">
        <a href="index.html">Home</a>
        <a href="culture.html">Culture</a>
        <a href="shops.html">Shops &amp; Markets</a>
        <a href="miracle.html">Miracle's Experience</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>

    <main class="page">
      <section class="page-title reveal">
        <p class="eyebrow">Gallery</p>
        <h1>Image stories from streets, food, culture, and the coast.</h1>
      </section>

      <section class="section reveal">
        <div class="gallery-grid">
          <article class="gallery-item">
            <figure class="gallery-frame">
              <img data-fallback src="../assets/streets.jpeg" data-src="../assets/kktc-gallery-1.jpg" alt="Northern Cyprus street scene" loading="lazy">
              <div class="image-fallback" data-image-fallback hidden>
                <strong>Street life</strong>
                <span></span>
              </div>
            </figure>
          </article>
          <article class="gallery-item">
            <figure class="gallery-frame">
              <img data-fallback src="../assets/food 2.jpeg" data-src="../assets/kktc-gallery-2.jpg" alt="Northern Cyprus food plate" loading="lazy">
              <div class="image-fallback" data-image-fallback hidden>
                <strong>Food</strong>
                <span></span>
              </div>
            </figure>
          </article>
          <article class="gallery-item">
            <figure class="gallery-frame">
              <img data-fallback src="../assets/shops.jpeg" data-src="../assets/kktc-gallery-3.jpg" alt="Local market and shop photos" loading="lazy">
              <div class="image-fallback" data-image-fallback hidden>
                <strong>Markets</strong>
                <span></span>
              </div>
              
            </figure>
          </article>
          <article class="gallery-item">
            <figure class="gallery-frame">
              <img data-fallback src="../assets/karpaz-feat.jpg" data-src="../assets/kktc-gallery-4.jpg" alt="Northern Cyprus coastline" loading="lazy">
              <div class="image-fallback" data-image-fallback hidden>
                <strong>Coastline</strong>
                <span></span>
              </div>
            </figure>
          </article>
          <article class="gallery-item">
            <figure class="gallery-frame">
              <img data-fallback src="../assets/kktcdrama.jpeg" data-src="../assets/kktc-gallery-5.jpg" alt="Traditional culture and gathering" loading="lazy">
              <div class="image-fallback" data-image-fallback hidden>
                <strong>Culture</strong>
                <span></span>
              </div>
            </figure>
          </article>
          <article class="gallery-item">
            <figure class="gallery-frame">
              <img data-fallback src="../assets/Buffavento-Castle5-1.jpg" data-src="../assets/kktc-gallery-6.jpg" alt="Natural landscapes and scenery" loading="lazy">
              <div class="image-fallback" data-image-fallback hidden>
                <strong>Nature</strong>
                <span></span>
              </div>

            </figure>
          </article>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>KKTC by Miracle</p>
      <a href="index.html">Back to home</a>
    </footer>
  </div>
  <script src="../js/script.js"></script>
</body>
</html>
